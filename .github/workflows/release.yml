name: Release

# Build HintMachine-<tag>.zip (HintMachine.exe + dependencies + ThreadstackFinder
# 32/64) and attach it to a GitHub release on tags v*.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download nuget.exe
        shell: pwsh
        run: curl -sL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

      - name: Restore NuGet packages
        shell: cmd
        run: nuget.exe restore HintMachine.sln

      - name: Build HintMachine (Release)
        shell: pwsh
        run: dotnet msbuild HintMachine\HintMachine.csproj -p:Configuration=Release -p:IncludePackageReferencesDuringMarkupCompilation=false -flp:logfile=msbuild.log -v:m -nologo

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log

      - name: Fetch ThreadstackFinder 32/64 from upstream release
        shell: pwsh
        run: |
          curl -sL -o hm_up.zip https://github.com/HintMachine/hintMachine/releases/download/1.2.0-rc1/HintMachine_1.2.0.zip
          tar -xf hm_up.zip ThreadstackFinder32.exe ThreadstackFinder64.exe

      - name: Stage release zip
        shell: pwsh
        run: |
          $staging = "dist"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $bin = "HintMachine\bin\Release"
          Copy-Item "$bin\HintMachine.exe", "$bin\HintMachine.exe.config", "$bin\Archipelago.MultiClient.Net.dll", "$bin\Newtonsoft.Json.dll" $staging
          Copy-Item -Recurse -Force "$bin\Assets" "$staging\"
          Copy-Item ThreadstackFinder32.exe, ThreadstackFinder64.exe $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "HintMachine-$($env:GITHUB_REF_NAME).zip" -Force

      - name: Verify zip structure
        shell: pwsh
        run: Get-ChildItem HintMachine-*.zip | ForEach-Object { tar -tf $_.Name }

      - name: Create GitHub release with the zip as asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HintMachine-*.zip
          generate_release_notes: true
